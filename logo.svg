<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Icon Shape & Clip -->
    <rect id="icon-bg" width="512" height="512" rx="136" />
    <clipPath id="icon-clip">
      <use href="#icon-bg" />
    </clipPath>

    <!-- 3D Convex Gradients for Frog -->
    <linearGradient id="frogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Inner Belly Gradient -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Pill Gradients -->
    <linearGradient id="pillPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="pillBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 3D Emboss & Depth Filters -->
    <filter id="outer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#065F46" flood-opacity="0.22" />
    </filter>

    <filter id="emboss-3d" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="-3" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Frame -->
  <g filter="url(#outer-shadow)">
    <use href="#icon-bg" fill="#ECFDF5" />
  </g>

  <!-- Content -->
  <g clip-path="url(#icon-clip)">
    <!-- Frog Eyes Socket -->
    <g fill="url(#frogGrad)" filter="url(#emboss-3d)">
      <circle cx="152" cy="148" r="72" />
      <circle cx="360" cy="148" r="72" />
    </g>

    <!-- Frog Head & Body -->
    <ellipse cx="256" cy="260" rx="192" ry="150" fill="url(#frogGrad)" filter="url(#emboss-3d)" />

    <!-- Frog Eyes Details -->
    <g filter="url(#emboss-3d)">
      <circle cx="152" cy="148" r="48" fill="#FFFFFF" />
      <circle cx="360" cy="148" r="48" fill="#FFFFFF" />
    </g>
    <circle cx="156" cy="148" r="24" fill="#064E3B" />
    <circle cx="356" cy="148" r="24" fill="#064E3B" />
    <circle cx="146" cy="138" r="9" fill="#FFFFFF" />
    <circle cx="346" cy="138" r="9" fill="#FFFFFF" />

    <!-- Belly -->
    <ellipse cx="256" cy="310" rx="100" ry="70" fill="url(#bellyGrad)" />

    <!-- Rosy Cheeks -->
    <ellipse cx="120" cy="270" rx="24" ry="15" fill="#F43F5E" opacity="0.35" />
    <ellipse cx="392" cy="270" rx="24" ry="15" fill="#F43F5E" opacity="0.35" />

    <!-- Nostrils & Smile -->
    <ellipse cx="236" cy="242" rx="4" ry="6" fill="#064E3B" />
    <ellipse cx="276" cy="242" rx="4" ry="6" fill="#064E3B" />
    <path d="M 206 270 Q 256 312 306 270" stroke="#064E3B" stroke-width="12" fill="none" stroke-linecap="round" />

    <!-- Capsule 1 (Left Pink/White Tilt) -->
    <g filter="url(#emboss-3d)" transform="translate(225, 385) rotate(-22)">
      <path d="M -22 -45 A 22 22 0 0 1 22 -45 L 22 0 L -22 0 Z" fill="url(#pillPink)" />
      <path d="M -22 0 L 22 0 L 22 45 A 22 22 0 0 1 -22 45 Z" fill="#FFFFFF" />
      <path d="M -10 -35 V 35" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- Capsule 2 (Right Blue/White Tilt) -->
    <g filter="url(#emboss-3d)" transform="translate(287, 385) rotate(22)">
      <path d="M -22 -45 A 22 22 0 0 1 22 -45 L 22 0 L -22 0 Z" fill="url(#pillBlue)" />
      <path d="M -22 0 L 22 0 L 22 45 A 22 22 0 0 1 -22 45 Z" fill="#FFFFFF" />
      <path d="M -10 -35 V 35" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- Hugging Paws -->
    <circle cx="126" cy="402" r="54" fill="url(#frogGrad)" filter="url(#emboss-3d)" />
    <circle cx="386" cy="402" r="54" fill="url(#frogGrad)" filter="url(#emboss-3d)" />
  </g>
</svg>
