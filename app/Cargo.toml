[workspace]

[package]
name = "snap-herb-app"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "snap_herb_app"
path = "src/lib.rs"

[[bin]]
name = "snap-herb-app"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
snap-herb-core = { path = "../crates/core" }
snap-herb-models = { path = "../crates/models" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "MouseEvent",
    "Node",
    "SubmitEvent",
    "Url",
    "Window",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "Window",
] }
