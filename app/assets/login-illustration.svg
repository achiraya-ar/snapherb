<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 55 500 440" role="img" aria-labelledby="snap-herb-login-title">
  <title id="snap-herb-login-title">SnapHerb — กบถือใบเบิกยาสมุนไพร</title>
  <defs>
    <radialGradient id="login-halo" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92" />
      <stop offset="58%" stop-color="#DCFCE7" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="login-frog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="login-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
