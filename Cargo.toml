[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/core",
    "crates/hosxp-connector",
    "src-tauri",
]
default-members = [
    "crates/models",
    "crates/core",
    "crates/hosxp-connector",
]

[workspace.package]
version = "1.26.1025"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
encryptman = "0.5.0"
encryptman-keyring = "0.1.3"
md-5 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = { version = "0.10", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "tls-rustls-ring-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
tempfile = "3"
